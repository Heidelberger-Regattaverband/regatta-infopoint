name: Continuous Integration

on:
  # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ui5_checks:
    name: Check UI5 frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui5/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint UI5 and TypeScript
        run: npm run lint:strict

      - name: Check TypeScript types
        run: npm run ts-typecheck

      - name: Test async callbacks
        run: npm run test:async

  build_and_test:
    name: Build and test rust project
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          version: latest
          tags: tag:ci
          use-cache: 'true'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          toolchain: stable

      - name: Restore build & cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Enforce formatting, linting and rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo doc --workspace --all-features --no-deps --document-private-items --locked  

      - name: Build and run tests
        uses: actions-rs/cargo@v1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RUST_LOG: ${{ vars.RUST_LOG }}
        with:
          command: test
          args: --workspace

      # - uses: actions-rs/cargo@v1
      #   with:
      #     command: build
      #     args: --release --all-features
